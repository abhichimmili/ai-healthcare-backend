
# Application Name
spring.application.name=healthcare

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/aihealthcare
spring.datasource.username=root
spring.datasource.password=Admin@mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8081

# JWT Configuration
app.jwt.secret=${JWT_SECRET:HealthcareApplicationSecretKey12345678901234567890}
app.jwt.expiration=86400000

# Groq Chat Completions (key is never committed)
ai.api.key=${GROQ_API_KEY:}
ai.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
ai.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Medical Report File Storage
app.file.upload-dir=uploads/medical-reports

# Multipart Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Frontend origin
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}